<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FITNESS Tees</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --serif: "EB Garamond", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --base: #0b6f8c;
    --fg: #ffffff;
    --fg-soft: rgba(255,255,255,0.84);
    --fg-faint: rgba(255,255,255,0.62);
    --btn-bg: #ffffff;
    --btn-fg: #101010;
    --arrow-bg: rgba(0,0,0,0.32);
    --arrow-fg: #ffffff;
    --chip-bg: rgba(0,0,0,0.78);
    --chip-fg: #ffffff;
    --chip-on-bg: #ffffff;
    --chip-on-fg: #0b0b0b;
    --line: rgba(255,255,255,0.28);
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--base);
    color: var(--fg);
    font-family: var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: color 0.5s ease;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  .bg { position: fixed; inset: 0; opacity: 0; transition: opacity 0.7s ease; z-index: 0; pointer-events: none; }
  .bg.on { opacity: 1; }
  .app {
    position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; min-height: 100%;
    display: grid; grid-template-rows: auto 1fr auto;
    padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(22px + env(safe-area-inset-bottom, 0px));
  }
  nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 6px 2%; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; justify-self: start; }
  .logo svg { width: 30px; height: 30px; flex: none; }
  .logo span { font-weight: 800; letter-spacing: 0.16em; font-size: 15px; }
  .nav-links { display: flex; gap: 6px; list-style: none; align-items: center; }
  .nav-links a { display: block; text-decoration: none; font-size: 15px; font-weight: 500; padding: 4px 14px; border-radius: 6px; transition: opacity 0.2s; }
  .nav-links a:hover { opacity: 0.7; }
  .nav-links a[aria-current="page"] { background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; }
  .nav-order { justify-self: end; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background 0.2s, color 0.2s; }
  .nav-order:hover { background: var(--btn-bg); color: var(--btn-fg); }
  .nav-order svg { width: 16px; height: 16px; }
  .stage { display: grid; grid-template-columns: 1fr minmax(260px, 360px) 1fr; align-items: center; gap: 28px; padding: 10px 2%; }
  .copy { min-width: 0; max-width: 400px; }
